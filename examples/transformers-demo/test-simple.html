<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers.js Simple Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #status {
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            background: #f0f0f0;
        }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .loading { background: #e3f2fd; color: #1565c0; }
    </style>
</head>
<body>
    <h1>🧪 Transformers.js Simple Test</h1>
    <div id="status" class="loading">Loading transformers.js...</div>
    <div id="output"></div>

    <script type="module">
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        async function test() {
            try {
                status.textContent = 'Step 1: Importing @xenova/transformers...';
                
                // Import transformers.js
                const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
                
                status.textContent = 'Step 2: Creating pipeline...';
                status.className = 'loading';
                
                // Create a simple sentiment analysis pipeline (smaller model)
                const classifier = await pipeline('sentiment-analysis');
                
                status.textContent = 'Step 3: Testing model...';
                
                // Test it
                const result = await classifier('I love this framework!');
                
                status.textContent = '✅ Success! Transformers.js is working!';
                status.className = 'success';
                
                output.innerHTML = `
                    <h2>Test Result:</h2>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                status.textContent = `❌ Error: ${error.message}`;
                status.className = 'error';
                output.innerHTML = `
                    <h2>Error Details:</h2>
                    <pre>${error.stack}</pre>
                `;
                console.error('Test failed:', error);
            }
        }

        test();
    </script>
</body>
</html>
